<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>devvit</title>
  </head>
  <body class="app">
    <div class="battlefield-scene" id="battlefield-scene"></div>
    <section class="summary-map" id="summary-map" aria-label="Campaign territory map" hidden>
      <img src="/assets/maps/world.webp" alt="Global campaign map" />
      <div class="summary-map__grid" id="summary-map-grid"></div>
    </section>
    <img class="splash-awards" src="/assets/awards.webp" alt="" aria-hidden="true" draggable="false" />
    <section class="game-title" aria-label="Game title">
      <img class="game-title__logo" id="game-logo" alt="The first truly epic war of humanity against AI" draggable="false" />
    </section>
    <main class="content">
      <h1 class="title" id="title"></h1>
      <p class="state-detail" id="state-detail"></p>
      <div class="action-row">
        <button class="start-button" id="start-button">Start</button>
        <button class="day-leaderboard-button" id="day-leaderboard-button" hidden>Daily leaderboard</button>
        <button class="test-message-button" id="test-message-button">Dev: AI status</button>
        <button class="comments-button comments-button--green" id="comments-green-button">Dev: Green analysis</button>
        <button class="comments-button comments-button--blue" id="comments-blue-button">Dev: Blue analysis</button>
      </div>
    </main>
    <div class="stats-ticker" aria-label="Game statistics">
      <div class="stats-ticker__track">
        LOADING LIVE CAMPAIGN DATA...
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
